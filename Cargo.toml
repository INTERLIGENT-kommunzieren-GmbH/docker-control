[package]
name = "docker-control"
version = "2.8.2"
edition = "2024"
description = "a CLI tool to control ik docker stack"
homepage = "https://github.com/INTERLIGENT-kommunzieren-GmbH/docker-control"
repository = "git@github.com:INTERLIGENT-kommunzieren-GmbH/docker-control.git"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive"] }
console = "0.16.6"
git2 = { version = "0.21.0", features = ["ssh", "https"] }
inquire = "0.9.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

tokio = { version = "1.54.1", features = ["full"] }
reqwest = { version = "0.13.5", features = ["json"] }
chrono = "0.4.45"
include_dir = "0.7.4"
directories = "6.0.0"
libc = "0.2"
get_if_addrs = "0.5.3"
fs_extra = "1.3"
walkdir = "2.5"
bollard = "0.21.1"
daemonize = "0.5"
sha2 = "0.11.1"
rhai = "1.27.0"
base64 = "0.23"
hmac = "0.13"
sha1 = "0.11"

[dev-dependencies]
tempfile = "3.27.0"

[profile.dist]
inherits = "release"
lto = "thin"
